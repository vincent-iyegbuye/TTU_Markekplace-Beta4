
<!DOCTYPE html>
<!-- Vincent - Listing Published Page -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Listing Published | TTU Marketplace</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Shared Navigation -->
    <header>
        <nav class="site-nav" aria-label="Main navigation">

            <!-- Website Logo -->
            <a href="index.html">TTU Marketplace</a>

            <!-- Search Bar -->
            <input
                type="search"
                name="search"
                placeholder="Search marketplace..."
                aria-label="Search marketplace listings"
            >

            <!-- Navigation Links -->
            <a href="index.html" aria-current="page">
                Marketplace
            </a>

            <a href="saved.html">Saved</a>

            <a href="messages.html">Messages</a>

            <a href="profile.html">Profile</a>

            <!-- Sell Item -->
            <a href="create-listing.html">Sell Item</a>

        </nav>
    </header>

    <!-- Main Content -->
    <main class="listing-published-page">

        <!-- Publication Confirmation -->
        <section class="published-card"
                 aria-labelledby="published-title">

            <!-- Success Icon -->
            <div class="published-icon" aria-hidden="true">
                &#10003;
            </div>

            <!-- Confirmation Message -->
            <h1 id="published-title">
                Your item is live!
            </h1>

            <p class="published-description">
                Your listing is now visible to verified
                TTU students.
            </p>

            <!-- Published Item Summary -->
            <div class="published-item">

                <h2>MacBook Air M2</h2>

                <p>$650 &bull; Good</p>

            </div>

            <!-- Action Buttons -->
            <div class="published-actions">

                <a href="listing-details.html"
                   class="published-view">
                    View Listing
                </a>

                <a href="manage-listing.html"
                   class="published-manage">
                    Manage Listing
                </a>

            </div>

        </section>

    </main>

    <!-- Shared Footer -->
    <footer class="site-footer">

        <div class="footer-content">

            <p>&copy; 2026 TTU Marketplace.</p>

            <p>
                A student-developed marketplace project
                for the Texas Tech community.
            </p>

        </div>

    </footer>

</body>
</html>
